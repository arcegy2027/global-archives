<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Archives — Explore the World's Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --void:#0B0F17;
    --slate:#111827;
    --slate-2:#151E2E;
    --cyan:#38BDF8;
    --indigo:#6366F1;
    --gold:#F59E0B;
    --gold-deep:#D97706;
    --text:#E7EBF3;
    --text-muted:#8A93A6;
    --text-faint:#5B6478;
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.16);
    --glass:rgba(17,24,39,0.62);
    --focus:#7DD3FC;
    --font-ui:'Plus Jakarta Sans', system-ui, sans-serif;
    --font-display:'Cinzel', serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at 50% -10%, #142033 0%, var(--void) 55%);
    color:var(--text);
    font-family:var(--font-ui);
    overflow:hidden;
    height:100vh;
    width:100vw;
    -webkit-tap-highlight-color: transparent;
  }
  ::selection{background:var(--cyan);color:var(--void);}
  a{color:inherit;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px;}

  /* ---------- App shell ---------- */
  #app{position:relative;height:100vh;width:100vw; overflow:hidden;}
  #app::before{
    content:''; position:absolute; inset:-10%; pointer-events:none;
    background:
      radial-gradient(circle at 18% 28%, rgba(56,189,248,0.18), transparent 20%),
      radial-gradient(circle at 70% 14%, rgba(99,102,241,0.18), transparent 22%),
      radial-gradient(circle at 60% 78%, rgba(245,158,11,0.16), transparent 26%);
    filter:blur(30px);
    z-index:0;
  }
  #app::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(circle at 15% 15%, rgba(255,255,255,0.24) 0, transparent 1.2px),
      radial-gradient(circle at 75% 28%, rgba(255,255,255,0.18) 0, transparent 1.5px),
      radial-gradient(circle at 45% 70%, rgba(255,255,255,0.2) 0, transparent 1.3px);
    background-size:180px 180px; opacity:0.4; z-index:0;
  }

  #canvas-wrap{position:absolute;inset:0; z-index:1;}
  #globe-canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none;}
  #globe-canvas.dragging{cursor:grabbing;}

  #hint{
    position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
    font-size:12.5px; color:var(--text-faint); letter-spacing:.02em;
    pointer-events:none; transition:opacity .6s ease; z-index:12;
  }
  #hint.hide{opacity:0;}

  .feature-bar{
    position:absolute; left:28px; bottom:52px; z-index:18; pointer-events:none;
  }
  .feature-card{
    pointer-events:auto; min-width:220px; max-width:280px;
    border:1px solid var(--border-strong); border-radius:14px;
    background:rgba(10,16,24,0.42); backdrop-filter:blur(14px);
    box-shadow:0 18px 40px rgba(0,0,0,0.22);
    padding:12px 14px 11px; color:var(--text);
  }
  .feature-card .eyebrow{
    display:block; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:7px;
  }
  .feature-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .feature-name{font-family:var(--font-display); font-size:18px; line-height:1.2; color:var(--text);}
  .feature-sub{color:var(--text-muted); font-size:11.5px; margin-top:4px;}
  .feature-pill{
    flex-shrink:0; padding:6px 8px; border-radius:999px; border:1px solid rgba(56,189,248,0.35);
    background:rgba(56,189,248,0.08); color:var(--cyan); font-size:9px; letter-spacing:.08em; text-transform:uppercase;
  }

  /* ---------- Top bar ---------- */
  header{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 28px;
    pointer-events:none;
  }
  header > *{pointer-events:auto;}
  .brand{display:flex; align-items:center; gap:11px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg, var(--cyan), var(--indigo));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 22px rgba(56,189,248,0.35);
    flex-shrink:0;
  }
  .brand-mark svg{width:18px;height:18px;stroke:var(--void);}
  .brand-text{display:flex;flex-direction:column;line-height:1.1;}
  .brand-text .name{font-family:var(--font-display); font-size:16.5px; font-weight:600; letter-spacing:.03em;}
  .brand-text .sub{font-size:10.5px; color:var(--text-faint); letter-spacing:.08em; margin-top:2px;}

  .search-trigger{
    display:flex; align-items:center; gap:10px;
    background:var(--glass); backdrop-filter:blur(14px);
    border:1px solid var(--border); border-radius:11px;
    padding:9px 12px 9px 14px; color:var(--text-muted);
    font-size:13px; cursor:pointer; transition:border-color .18s ease, background .18s ease;
    min-width:230px;
  }
  .search-trigger:hover, .search-trigger:focus-visible{border-color:var(--border-strong); background:rgba(21,30,46,0.8);}
  .search-trigger svg{width:15px;height:15px;flex-shrink:0;opacity:.8;}
  .search-trigger .kbd{
    margin-left:auto; display:flex; gap:3px;
  }
  .search-trigger .kbd span{
    font-size:10.5px; padding:2px 6px; border-radius:5px;
    background:rgba(255,255,255,0.06); border:1px solid var(--border);
    color:var(--text-faint);
  }

  /* ---------- Tooltip ---------- */
  #tooltip{
    position:absolute; z-index:15; pointer-events:none;
    background:var(--glass); backdrop-filter:blur(12px);
    border:1px solid var(--border-strong); border-radius:10px;
    padding:9px 13px; font-size:12.5px; white-space:nowrap;
    transform:translate(-50%, -130%); opacity:0; transition:opacity .12s ease;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
  }
  #tooltip.show{opacity:1;}
  #tooltip .t-name{font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:7px;}
  #tooltip .t-stats{color:var(--text-muted); margin-top:3px; font-size:11.5px;}

  /* ---------- Command palette ---------- */
  #cmdk-overlay{
    position:fixed; inset:0; z-index:60; background:rgba(6,9,15,0.72);
    backdrop-filter:blur(4px);
    display:flex; align-items:flex-start; justify-content:center;
    padding-top:14vh;
    opacity:0; pointer-events:none; transition:opacity .16s ease;
  }
  #cmdk-overlay.open{opacity:1; pointer-events:auto;}
  #cmdk{
    width:min(560px, 90vw); background:#0E1522; border:1px solid var(--border-strong);
    border-radius:14px; box-shadow:0 30px 80px rgba(0,0,0,0.55);
    transform:translateY(-8px); transition:transform .16s ease;
    overflow:hidden;
  }
  #cmdk-overlay.open #cmdk{transform:translateY(0);}
  #cmdk-input-row{display:flex; align-items:center; gap:11px; padding:15px 18px; border-bottom:1px solid var(--border);}
  #cmdk-input-row svg{width:16px;height:16px; color:var(--text-faint); flex-shrink:0;}
  #cmdk-input{
    flex:1; background:none; border:none; outline:none; color:var(--text);
    font-family:inherit; font-size:15px;
  }
  #cmdk-input::placeholder{color:var(--text-faint);}
  #cmdk-esc{font-size:11px; color:var(--text-faint); border:1px solid var(--border); border-radius:5px; padding:2px 7px;}
  #cmdk-list{max-height:320px; overflow-y:auto; padding:8px;}
  .cmdk-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px;
    cursor:pointer; font-size:13.5px; color:var(--text);
  }
  .cmdk-item .flag{font-size:16px;}
  .cmdk-item .meta{color:var(--text-faint); font-size:11.5px; margin-left:auto;}
  .cmdk-item.active{background:rgba(56,189,248,0.12);}
  .cmdk-empty{padding:26px 12px; text-align:center; color:var(--text-faint); font-size:13px;}

  /* ---------- Drawer ---------- */
  #scrim{
    position:absolute; inset:0; z-index:30; background:rgba(4,7,12,0.45);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  #scrim.open{opacity:1; pointer-events:auto;}

  #drawer{
    position:absolute; top:0; right:0; bottom:0; z-index:31;
    width:min(500px, 100vw);
    background:linear-gradient(180deg, #101827 0%, #0D1420 100%);
    border-left:1px solid var(--border-strong);
    transform:translateX(100%);
    transition:transform .32s cubic-bezier(.22,.68,0,1);
    display:flex; flex-direction:column;
    box-shadow:-30px 0 70px rgba(0,0,0,0.5);
  }
  #drawer.open{transform:translateX(0);}
  #drawer.egypt{
    background:linear-gradient(180deg, #1A1408 0%, #0D1420 38%);
  }
  #drawer.egypt::before{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:
      radial-gradient(circle at 20% 8%, rgba(245,158,11,0.16), transparent 40%),
      repeating-linear-gradient(135deg, rgba(245,158,11,0.025) 0px, rgba(245,158,11,0.025) 2px, transparent 2px, transparent 10px);
  }

  #drawer-scroll{overflow-y:auto; flex:1; padding-bottom:40px;}

  .drawer-top{
    display:flex; align-items:center; gap:12px; padding:20px 22px;
    border-bottom:1px solid var(--border); position:relative; z-index:1;
  }
  #drawer.egypt .drawer-top{border-bottom:1px solid rgba(245,158,11,0.28);}
  .flag-badge{
    width:38px;height:38px;border-radius:10px; flex-shrink:0;
    display:flex;align-items:center;justify-content:center; font-size:19px;
    background:rgba(255,255,255,0.05); border:1px solid var(--border);
  }
  #drawer.egypt .flag-badge{border-color:rgba(245,158,11,0.4); box-shadow:0 0 18px rgba(245,158,11,0.25);}
  .drawer-top .titles{flex:1; min-width:0;}
  .drawer-top h2{margin:0; font-size:17px; font-weight:600; font-family:var(--font-display); letter-spacing:.01em;}
  .drawer-top .seal{font-size:11px; color:var(--gold); margin-top:2px; letter-spacing:.03em;}
  .drawer-actions{display:flex; gap:6px;}
  .icon-btn{
    width:32px;height:32px; border-radius:8px; border:1px solid var(--border);
    background:rgba(255,255,255,0.03); color:var(--text-muted);
    display:flex;align-items:center;justify-content:center; cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.08); color:var(--text); border-color:var(--border-strong);}
  .icon-btn.active{color:var(--gold); border-color:rgba(245,158,11,0.5); background:rgba(245,158,11,0.1);}
  .icon-btn svg{width:15px;height:15px;}

  .drawer-section{padding:20px 22px; border-bottom:1px solid var(--border); position:relative; z-index:1;}
  #drawer.egypt .drawer-section{border-bottom:1px solid rgba(245,158,11,0.12);}
  .drawer-section:last-child{border-bottom:none;}
  .section-label{
    display:flex; align-items:center; gap:8px;
    font-size:11.5px; letter-spacing:.06em; color:var(--text-faint); margin-bottom:13px;
    text-transform:uppercase;
  }
  #drawer.egypt .section-label{color:var(--gold-deep);}
  .section-label svg{width:13px;height:13px;}

  .fact-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .fact{
    background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:10px;
    padding:11px 13px;
  }
  .fact .k{font-size:10.5px; color:var(--text-faint); letter-spacing:.03em;}
  .fact .v{font-size:15px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums;}
  #drawer.egypt .fact{border-color:rgba(245,158,11,0.16);}

  .timeline{list-style:none; margin:0; padding:0; position:relative;}
  .timeline::before{content:''; position:absolute; left:5px; top:6px; bottom:6px; width:1px; background:var(--border-strong);}
  .timeline li{position:relative; padding-left:24px; padding-bottom:16px;}
  .timeline li:last-child{padding-bottom:0;}
  .timeline li::before{
    content:''; position:absolute; left:0; top:4px; width:11px;height:11px; border-radius:50%;
    background:var(--slate); border:2px solid var(--cyan);
  }
  #drawer.egypt .timeline li::before{border-color:var(--gold);}
  .timeline .yr{font-size:12px; color:var(--cyan); font-weight:600; font-variant-numeric:tabular-nums;}
  #drawer.egypt .timeline .yr{color:var(--gold);}
  .timeline .ev{font-size:13px; color:var(--text-muted); margin-top:2px; line-height:1.45;}

  .body-text{font-size:13.5px; line-height:1.65; color:var(--text-muted);}

  .doc-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .doc-card{
    border-radius:11px; border:1px solid var(--border); cursor:pointer;
    padding:14px 13px; background:linear-gradient(155deg, rgba(255,255,255,0.045), rgba(255,255,255,0.01));
    transition:transform .15s ease, border-color .15s ease;
    display:flex; flex-direction:column; gap:8px; min-height:118px;
  }
  .doc-card:hover{transform:translateY(-2px); border-color:var(--border-strong);}
  #drawer.egypt .doc-card{border-color:rgba(245,158,11,0.18); background:linear-gradient(155deg, rgba(245,158,11,0.07), rgba(255,255,255,0.01));}
  #drawer.egypt .doc-card:hover{border-color:rgba(245,158,11,0.45);}
  .doc-card .doc-icon{width:26px;height:26px; opacity:.85;}
  .doc-card .doc-title{font-size:12.5px; font-weight:600; line-height:1.3;}
  .doc-card .doc-desc{font-size:11px; color:var(--text-faint); line-height:1.4;}

  .era-block{margin-bottom:16px;}
  .era-block:last-child{margin-bottom:0;}
  .era-title{font-size:13px; font-weight:600; color:var(--gold); margin-bottom:5px; display:flex; align-items:center; gap:7px;}
  .era-title .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}

  /* ---------- Lightbox ---------- */
  #lightbox-overlay{
    position:fixed; inset:0; z-index:70; background:rgba(4,6,10,0.8); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:24px;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  #lightbox-overlay.open{opacity:1; pointer-events:auto;}
  #lightbox{
    width:min(480px,92vw); border-radius:16px; padding:36px 30px;
    background:linear-gradient(160deg, #171008 0%, #0D1420 70%);
    border:1px solid rgba(245,158,11,0.35);
    text-align:center; position:relative;
    transform:scale(.94); transition:transform .2s ease;
  }
  #lightbox-overlay.open #lightbox{transform:scale(1);}
  #lightbox::before{
    content:''; position:absolute; inset:10px; border:1px solid rgba(245,158,11,0.25); border-radius:10px; pointer-events:none;
  }
  #lightbox .lb-icon{width:44px;height:44px; margin:0 auto 16px; opacity:.9;}
  #lightbox h3{font-family:var(--font-display); font-size:19px; margin:0 0 10px; color:var(--gold);}
  #lightbox p{font-size:13.5px; color:var(--text-muted); line-height:1.6; margin:0;}
  #lightbox-close{position:absolute; top:14px; right:14px;}

  /* ---------- Mobile / low-power grid fallback ---------- */
  #grid-fallback{
    position:absolute; inset:0; padding:96px 20px 30px; overflow-y:auto; display:none;
  }
  #grid-fallback.active{display:block;}
  #grid-fallback .grid-wrap{max-width:640px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .country-card{
    background:var(--glass); border:1px solid var(--border); border-radius:13px;
    padding:15px; cursor:pointer; text-align:left; color:var(--text);
  }
  .country-card .flag{font-size:22px;}
  .country-card .cname{font-size:13.5px; font-weight:600; margin-top:8px;}
  .country-card .cmeta{font-size:11px; color:var(--text-faint); margin-top:3px;}

  /* ---------- Scrollbars ---------- */
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12); border-radius:4px;}

  @media (max-width: 640px){
    body{overflow:hidden;}
    header{
      padding:14px 14px 0;
      align-items:flex-start;
      gap:10px;
    }
    .brand{gap:8px;}
    .brand-mark{width:30px;height:30px;border-radius:8px;}
    .brand-text .name{font-size:14px;}
    .brand-text .sub{font-size:8.5px; letter-spacing:.08em;}
    .search-trigger{
      min-width:44px; width:44px; height:42px; padding:0; justify-content:center;
      border-radius:12px; background:rgba(17,24,39,0.72);
    }
    .search-trigger .label, .search-trigger .kbd{display:none;}
    .feature-bar{left:14px; right:14px; bottom:26px;}
    .feature-card{max-width:none; min-width:0; width:100%; padding:10px 12px;}
    .feature-row{align-items:flex-start;}
    .feature-name{font-size:15px;}
    .feature-sub{font-size:10.5px;}
    .feature-pill{padding:5px 7px; font-size:8px;}
    #hint{
      bottom:90px; width:calc(100% - 32px); text-align:center; font-size:11px; line-height:1.4;
      white-space:normal;
    }
    #tooltip{max-width:calc(100vw - 28px); white-space:normal;}
    #cmdk{width:min(92vw, 420px); border-radius:12px;}
    #cmdk-input-row{padding:12px 14px; gap:8px;}
    #cmdk-list{max-height:260px;}
    .cmdk-item{padding:10px 10px;}
    .cmdk-item .meta{display:none;}
    #drawer{
      width:100vw; height:min(78vh, 540px); top:auto; bottom:0; right:0; left:0;
      border-left:none; border-top:1px solid var(--border-strong);
      transform:translateY(105%);
      box-shadow:0 -18px 40px rgba(0,0,0,0.35);
    }
    #drawer.open{transform:translateY(0);}
    .drawer-top{padding:16px 16px;}
    .drawer-actions{gap:5px;}
    .icon-btn{width:30px;height:30px;}
    .drawer-section{padding:16px;}
    .fact-grid, .doc-grid{grid-template-columns:1fr 1fr;}
    .doc-card{min-height:112px; padding:12px 11px;}
    .doc-card .doc-title{font-size:12px;}
    .doc-card .doc-desc{font-size:10.5px;}
    #lightbox{width:min(88vw, 420px); padding:28px 18px;}
    #lightbox h3{font-size:17px;}
    #lightbox p{font-size:12.5px;}
    #grid-fallback{padding:80px 14px 20px;}
    #grid-fallback .grid-wrap{grid-template-columns:1fr;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .sr-only{
    position:absolute; width:1px;height:1px; padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg>
      </div>
      <div class="brand-text">
        <span class="name">Global Archives</span>
        <span class="sub">WORLD MEMORY NETWORK</span>
      </div>
    </div>

    <button class="search-trigger" id="search-trigger" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span class="label">Search an archive…</span>
      <span class="kbd"><span>⌘</span><span>K</span></span>
    </button>
  </header>

  <!-- Accessible list of countries, visually hidden, always keyboard reachable -->
  <nav aria-label="Countries" class="sr-only" id="a11y-country-nav"></nav>

  <div id="canvas-wrap">
    <canvas id="globe-canvas"></canvas>
  </div>

  <div class="feature-bar" aria-live="polite">
    <div class="feature-card">
      <span class="eyebrow">Featured archive</span>
      <div class="feature-row">
        <div>
          <div class="feature-name" id="feature-name">Egypt</div>
          <div class="feature-sub" id="feature-sub">41% digitized · 12M+ items</div>
        </div>
        <div class="feature-pill">Live</div>
      </div>
    </div>
  </div>

  <div id="hint">Drag to rotate · Scroll to zoom · Click a node to open its archive</div>

  <div id="tooltip" role="status">
    <div class="t-name"><span class="flag"></span><span class="nm"></span></div>
    <div class="t-stats"></div>
  </div>

  <div id="grid-fallback">
    <div class="grid-wrap" id="grid-wrap"></div>
  </div>

  <!-- Command palette -->
  <div id="cmdk-overlay">
    <div id="cmdk" role="dialog" aria-modal="true" aria-label="Search archives">
      <div id="cmdk-input-row">

const $ = sel => document.querySelector(sel);
const canvas = $('#globe-canvas');
const tooltip = $('#tooltip');

function updateFeaturedCard(country){

  featureName.textContent = country.name;
  featureSub.textContent = country.digit + ' digitized · ' + country.storage;

/* ============================================================
   3D GLOBE
   ============================================================ */
let renderer, scene, camera, group, raycaster, pointer;
let markers = []; // {mesh, ring, data}
let hovered = null;
let dragging = false, dragMoved = false, lastX=0, lastY=0;
let rotY = 0.3, rotX = -0.15, targetRotY = 0.3, targetRotX = -0.15;
let distance = 6.4, targetDistance = 6.4;
let autoRotate = true;
let webglOK = true;

function latLonToVec3(lat, lon, r){
  const phi = (90 - lat) * Math.PI/180;
  const theta = (lon + 180) * Math.PI/180;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

function initGlobe(){
  try{
    renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
  }catch(e){ webglOK = false; }
  if(!renderer || !window.WebGLRenderingContext){
    webglOK = false;
  }
  if(!webglOK){ showFallback(); return; }

  const isPhone = window.matchMedia('(max-width: 640px)').matches;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isPhone ? 1.5 : 2));
  if(isPhone){
    targetDistance = 7.2;
    distance = 7.2;
    targetRotY = -0.25;
    rotY = -0.25;
    targetRotX = -0.22;
    rotX = -0.22;
  }
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0,0,distance);

  group = new THREE.Group();
  scene.add(group);

  const R = 2.0;

  // Dot-matrix sphere
  const dotCount = 2600;
  const positions = new Float32Array(dotCount*3);
  const colors = new Float32Array(dotCount*3);
  const cCyan = new THREE.Color('#38BDF8');
  const cIndigo = new THREE.Color('#6366F1');
  for(let i=0;i<dotCount;i++){
    const y = 1 - (i/(dotCount-1))*2;
    const radiusAtY = Math.sqrt(1-y*y);
    const theta = Math.PI * (1+Math.sqrt(5)) * i;
    const x = Math.cos(theta)*radiusAtY;
    const z = Math.sin(theta)*radiusAtY;
    positions[i*3]=x*R; positions[i*3+1]=y*R; positions[i*3+2]=z*R;
    const mixCol = cCyan.clone().lerp(cIndigo, (y+1)/2);
    colors[i*3]=mixCol.r; colors[i*3+1]=mixCol.g; colors[i*3+2]=mixCol.b;
  }
  const dotGeo = new THREE.BufferGeometry();
  dotGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  dotGeo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  const dotMat = new THREE.PointsMaterial({size:0.028, vertexColors:true, transparent:true, opacity:0.85, sizeAttenuation:true});
  const dots = new THREE.Points(dotGeo, dotMat);
  group.add(dots);

  // inner glow sphere
  const glowGeo = new THREE.SphereGeometry(R*0.985, 48, 48);
  const glowMat = new THREE.MeshBasicMaterial({color:0x0B1424, transparent:true, opacity:0.9});
  group.add(new THREE.Mesh(glowGeo, glowMat));

  // outer atmosphere
  const atmoGeo = new THREE.SphereGeometry(R*1.05, 48, 48);
  const atmoMat = new THREE.MeshBasicMaterial({color:0x38BDF8, transparent:true, opacity:0.06, side:THREE.BackSide});
  group.add(new THREE.Mesh(atmoGeo, atmoMat));

  // markers
  COUNTRIES.forEach(c=>{
    const pos = latLonToVec3(c.lat, c.lon, R*1.01);
    const isGold = !!c.special;
    const color = isGold ? 0xF59E0B : 0x38BDF8;
    const mGeo = new THREE.SphereGeometry(0.045, 16, 16);
    const mMat = new THREE.MeshBasicMaterial({color});
    const mesh = new THREE.Mesh(mGeo, mMat);
    mesh.position.copy(pos);
    mesh.userData.id = c.id;
    group.add(mesh);

    const ringGeo = new THREE.RingGeometry(0.065, 0.085, 24);
    const ringMat = new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.55, side:THREE.DoubleSide});
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(pos);
    ring.lookAt(pos.clone().multiplyScalar(2));
    group.add(ring);

    // invisible larger hit sphere for easier picking
    const hitGeo = new THREE.SphereGeometry(0.16, 10, 10);
    const hitMat = new THREE.MeshBasicMaterial({visible:false});
    const hit = new THREE.Mesh(hitGeo, hitMat);
    hit.position.copy(pos);
    hit.userData.id = c.id;
    group.add(hit);

    markers.push({mesh, ring, hit, data:c, basePos:pos, phase:Math.random()*Math.PI*2});
  });

  // arcs connecting a few hubs to Egypt
  const hub = markers.find(m=>m.data.id==='eg');
  const arcTargets = ['us','gb','fr','jp','br','au'];
  arcTargets.forEach(tid=>{
    const target = markers.find(m=>m.data.id===tid);
    if(!target) return;
    const mid = hub.basePos.clone().add(target.basePos).multiplyScalar(0.5).normalize().multiplyScalar(R*1.45);
    const curve = new THREE.QuadraticBezierCurve3(hub.basePos, mid, target.basePos);
    const pts = curve.getPoints(40);
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({color:0xF59E0B, transparent:true, opacity:0.28});
    group.add(new THREE.Line(geo, mat));
  });

  raycaster = new THREE.Raycaster();
  pointer = new THREE.Vector2();

  onResize();
  window.addEventListener('resize', onResize);
  attachInteraction();
  animate();
}

function onResize(){
  if(!renderer) return;
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}

function attachInteraction(){
  canvas.addEventListener('pointerdown', e=>{
    dragging = true; dragMoved = false;
    lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add('dragging');
    autoRotate = false;
    hint.classList.add('hide');
  });
  window.addEventListener('pointerup', ()=>{ dragging=false; canvas.classList.remove('dragging'); });
  window.addEventListener('pointermove', e=>{
    if(dragging){
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      if(Math.abs(dx)+Math.abs(dy) > 3) dragMoved = true;
      targetRotY += dx*0.005;
      targetRotX += dy*0.005;
      targetRotX = Math.max(-1.1, Math.min(1.1, targetRotX));
      lastX = e.clientX; lastY = e.clientY;
      tooltip.classList.remove('show');
    } else {
      handleHover(e);
    }
  });
  canvas.addEventListener('wheel', e=>{
    e.preventDefault();
    targetDistance += e.deltaY*0.0025;
    targetDistance = Math.max(3.4, Math.min(11, targetDistance));
  }, {passive:false});
  canvas.addEventListener('click', e=>{
    if(dragMoved) return;
    const id = pickAt(e.clientX, e.clientY);
    if(id) openDrawer(id);
  });
  canvas.addEventListener('pointerleave', ()=>{ tooltip.classList.remove('show'); hovered=null; });
}

function pickAt(x,y){
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((x-rect.left)/rect.width)*2-1;
  pointer.y = -((y-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer, camera);
  const hitMeshes = markers.map(m=>m.hit);
  const intersects = raycaster.intersectObjects(hitMeshes);
  if(intersects.length){
    return intersects[0].object.userData.id;
  }
  return null;
}

function handleHover(e){
  const id = pickAt(e.clientX, e.clientY);
  if(id){
    hovered = id;
    canvas.style.cursor = 'pointer';
    const c = byId[id];
    tooltip.querySelector('.flag').textContent = c.flag;
    tooltip.querySelector('.nm').textContent = c.name;
    tooltip.querySelector('.t-stats').textContent = c.digit+' digitized · est. '+c.founded;
    tooltip.style.left = e.clientX+'px';
    tooltip.style.top = e.clientY+'px';
    tooltip.classList.add('show');
  } else {
    hovered = null;
    canvas.style.cursor = 'grab';
    tooltip.classList.remove('show');
  }
}

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if(autoRotate && !dragging){ targetRotY += 0.0009; }

  rotY += (targetRotY-rotY)*0.08;
  rotX += (targetRotX-rotX)*0.08;
  distance += (targetDistance-distance)*0.08;

  group.rotation.y = rotY;
  group.rotation.x = rotX;
  camera.position.z = distance;

  markers.forEach(m=>{
    const s = 1 + Math.sin(t*2 + m.phase)*0.12;
    m.ring.scale.set(s,s,s);
    const isHover = hovered===m.data.id;
    m.mesh.scale.setScalar(isHover?1.6:1);
    const ringOpacity = isHover ? 0.9 : 0.55;
    m.ring.material.opacity = ringOpacity;
  });

  group.rotation.z = Math.sin(t * 0.38) * 0.04;
  renderer.render(scene, camera);
}

/* ============================================================
   FALLBACK GRID (no WebGL / narrow screens)
   ============================================================ */
function showFallback(){
  $('#grid-fallback').classList.add('active');
  $('#canvas-wrap').style.display='none';
  hint.style.display='none';
  const wrap = $('#grid-wrap');
  wrap.innerHTML = COUNTRIES.map(c=>(
    '<button class="country-card" data-id="'+c.id+'">'+
      '<div class="flag">'+c.flag+'</div>'+
      '<div class="cname">'+c.name+'</div>'+
      '<div class="cmeta">'+c.digit+' digitized · '+c.storage+'</div>'+
    '</button>'
  )).join('');
  wrap.querySelectorAll('.country-card').forEach(btn=>{
    btn.addEventListener('click', ()=>openDrawer(btn.dataset.id));
  });
}

/* ============================================================
   ACCESSIBLE KEYBOARD NAV LIST (always present)
   ============================================================ */
(function buildA11yNav(){
  const nav = $('#a11y-country-nav');
  nav.innerHTML = COUNTRIES.map(c=>'<button data-id="'+c.id+'">Open '+c.name+' archive</button>').join('');
  nav.querySelectorAll('button').forEach(btn=>{

/* ============================================================
   DRAWER
   ============================================================ */
function renderDrawer(c){
  const isEgypt = !!c.special;
  drawer.classList.toggle('egypt', isEgypt);
  const isBookmarked = bookmarks.has(c.id);

  let html = '';
  html += '<div class="drawer-top">';
  html += '<div class="flag-badge">'+c.flag+'</div>';
  html += '<div class="titles"><h2 id="drawer-title">'+c.name+'</h2>';
  html += isEgypt ? '<div class="seal">✦ Egyptian National Library &amp; Archives — Golden Collector Mode</div>' : '<div class="seal" style="color:var(--text-faint)">National Archive Record</div>';
  html += '</div>';
  html += '<div class="drawer-actions">';
  html += '<button class="icon-btn'+(isBookmarked?' active':'')+'" id="bk-btn" aria-pressed="'+isBookmarked+'" aria-label="Bookmark this archive">'+icon('bookmark')+'</button>';
  html += '<button class="icon-btn" id="share-btn" aria-label="Copy share link">'+icon('share')+'</button>';
  html += '<button class="icon-btn" id="close-btn" aria-label="Close panel">'+icon('close')+'</button>';
  html += '</div></div>';

  // Overview facts
  html += '<div class="drawer-section"><div class="section-label">'+icon('building',{w:1.8})+' Archive Overview</div>';
  html += '<p class="body-text" style="margin-bottom:13px;">'+c.overview+'</p>';
  html += '<div class="fact-grid">';
  html += '<div class="fact"><div class="k">Founded</div><div class="v">'+c.founded+'</div></div>';
  html += '<div class="fact"><div class="k">Storage</div><div class="v">'+c.storage+'</div></div>';
  html += '<div class="fact"><div class="k">Digitized</div><div class="v">'+c.digit+'</div></div>';
  html += '<div class="fact"><div class="k">Standard</div><div class="v">'+c.standard+'</div></div>';
  html += '</div></div>';

  if(isEgypt){
    html += '<div class="drawer-section"><div class="section-label">'+icon('scroll',{w:1.8})+' Historical Eras Covered</div>';
    c.eras.forEach(era=>{
      html += '<div class="era-block"><div class="era-title"><span class="dot"></span>'+era.title+'</div><div class="body-text">'+era.text+'</div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="drawer-section"><div class="section-label">'+icon('clock',{w:1.8})+' Historical Timeline</div>';
    html += '<ul class="timeline">';
    c.timeline.forEach(pt=>{ html += '<li><div class="yr">'+pt.yr+'</div><div class="ev">'+pt.ev+'</div></li>'; });
    html += '</ul></div>';
  }

  html += '<div class="drawer-section"><div class="section-label">'+icon('shield',{w:1.8})+' Management &amp; Governance</div>';
  html += '<p class="body-text">'+c.management+'</p></div>';

  html += '<div class="drawer-section"><div class="section-label">'+icon('file',{w:1.8})+' Featured '+(isEgypt?'Manuscripts':'Documents')+'</div>';
  html += '<div class="doc-grid">';
  c.documents.forEach(d=>{
    html += '<div class="doc-card" data-title="'+escapeAttr(d.title)+'" data-desc="'+escapeAttr(d.desc)+'">';
    html += '<div class="doc-icon">'+icon('file',{w:1.5})+'</div>';
    html += '<div class="doc-title">'+d.title+'</div>';
    html += '<div class="doc-desc">'+d.desc+'</div></div>';
  });
  html += '</div></div>';

  drawerScroll.innerHTML = html;

  drawerScroll.querySelector('#close-btn').addEventListener('click', closeDrawer);
  drawerScroll.querySelector('#bk-btn').addEventListener('click', ()=>{
    if(bookmarks.has(c.id)){ bookmarks.delete(c.id); } else { bookmarks.add(c.id); }
    renderDrawer(c);
    drawerScroll.querySelector('#bk-btn').focus();
  });
  drawerScroll.querySelector('#share-btn').addEventListener('click', (e)=>{
    const btn = e.currentTarget;
    const original = btn.innerHTML;
    btn.innerHTML = '✓';
    setTimeout(()=>{ btn.innerHTML = original; }, 1200);
  });
  drawerScroll.querySelectorAll('.doc-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      openLightbox(card.dataset.title, card.dataset.desc);
    });
  });
}

function escapeAttr(s){ return s.replace(/"/g,'&quot;'); }

function openDrawer(id){
  const c = byId[id];
  if(!c) return;
  lastFocused = document.activeElement;
  updateFeaturedCard(c);
  renderDrawer(c);
  scrim.classList.add('open');
  drawer.classList.add('open');
  document.addEventListener('keydown', onDrawerKeydown);
  setTimeout(()=>{ const cb = drawerScroll.querySelector('#close-btn'); if(cb) cb.focus(); }, 320);
}
function closeDrawer(){
  drawer.classList.remove('open');
  scrim.classList.remove('open');
  document.removeEventListener('keydown', onDrawerKeydown);
  if(lastFocused) lastFocused.focus();
}
function onDrawerKeydown(e){
  if(e.key==='Escape'){ closeDrawer(); return; }
  if(e.key==='Tab'){
    const focusables = drawer.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
    if(!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
}
scrim.addEventListener('click', closeDrawer);

/* ============================================================
   LIGHTBOX
   ============================================================ */
const lbOverlay = $('#lightbox-overlay');
function openLightbox(title, desc){
  $('#lb-title').textContent = title;
  $('#lb-desc').textContent = desc;
  lbOverlay.classList.add('open');
}
function closeLightbox(){ lbOverlay.classList.remove('open'); }
$('#lightbox-close').addEventListener('click', closeLightbox);
lbOverlay.addEventListener('click', e=>{ if(e.target===lbOverlay) closeLightbox(); });

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
const cmdkOverlay = $('#cmdk-overlay');
const cmdkInput = $('#cmdk-input');
const cmdkList = $('#cmdk-list');
let cmdActiveIdx = 0;
let cmdFiltered = COUNTRIES.slice();

function renderCmdk(){
  const q = cmdkInput.value.trim().toLowerCase();
  cmdFiltered = COUNTRIES.filter(c=>c.name.toLowerCase().includes(q));
  if(!cmdFiltered.length){
    cmdkList.innerHTML = '<div class="cmdk-empty">No archives match "'+cmdkInput.value+'"</div>';
    return;
  }
  cmdActiveIdx = Math.min(cmdActiveIdx, cmdFiltered.length-1);
  cmdkList.innerHTML = cmdFiltered.map((c,i)=>(
    '<div class="cmdk-item'+(i===cmdActiveIdx?' active':'')+'" data-id="'+c.id+'">'+
      '<span class="flag">'+c.flag+'</span><span>'+c.name+'</span>'+
      '<span class="meta">'+c.digit+' digitized</span></div>'
  )).join('');
  cmdkList.querySelectorAll('.cmdk-item').forEach(item=>{
    item.addEventListener('click', ()=>{ selectFromCmdk(item.dataset.id); });
  });
}
function selectFromCmdk(id){
  closeCmdk();
  openDrawer(id);
  focusGlobeOn(id);
}
function focusGlobeOn(id){
  if(!renderer) return;
  const m = markers.find(m=>m.data.id===id);
  if(!m) return;
  const lon = m.data.lon;
  targetRotY = -( (lon+180) * Math.PI/180 ) + Math.PI*0.5;
  autoRotate = false;
}
function openCmdk(){
  lastFocused = document.activeElement;
  cmdkOverlay.classList.add('open');
  cmdkInput.value=''; cmdActiveIdx=0;
  renderCmdk();
  setTimeout(()=>cmdkInput.focus(), 30);
}
function closeCmdk(){
  cmdkOverlay.classList.remove('open');
  if(lastFocused) lastFocused.focus();
}
cmdkInput.addEventListener('input', ()=>{ cmdActiveIdx=0; renderCmdk(); });
cmdkInput.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); cmdActiveIdx=Math.min(cmdActiveIdx+1, cmdFiltered.length-1); renderCmdk(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); cmdActiveIdx=Math.max(cmdActiveIdx-1,0); renderCmdk(); }
  else if(e.key==='Enter'){ e.preventDefault(); if(cmdFiltered[cmdActiveIdx]) selectFromCmdk(cmdFiltered[cmdActiveIdx].id); }
  else if(e.key==='Escape'){ closeCmdk(); }
});
cmdkOverlay.addEventListener('click', e=>{ if(e.target===cmdkOverlay) closeCmdk(); });
$('#search-trigger').addEventListener('click', openCmdk);

document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    if(cmdkOverlay.classList.contains('open')) closeCmdk(); else openCmdk();
  }
});

/* ============================================================
   INIT
   ============================================================ */
function checkLowPower(){
  const noGL = !(function(){
    try{ const c=document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl')||c.getContext('experimental-webgl'))); }
    catch(e){ return false; }
  })();
  return noGL;
}

updateFeaturedCard(byId.eg);

if(checkLowPower()){
  showFallback();
} else if(typeof THREE === 'undefined'){
  showFallback();
} else {
  initGlobe();
  setTimeout(()=>hint.classList.add('hide'), 6000);
}

})();
</script>
